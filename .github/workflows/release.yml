name: Build Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish and package
        shell: pwsh
        run: |
          $publishChatGpt = Join-Path $PWD 'publish-chatgpt'
          dotnet publish src/Codex550COverlay/Codex550COverlay.csproj -c Release -r win-x64 --self-contained true -o $publishChatGpt
          if ($LASTEXITCODE -ne 0) { throw 'ChatGPT edition publish failed.' }
          Copy-Item packaging/chatgpt/* $publishChatGpt/ -Force
          $chatGptZip = Join-Path $PWD 'ChatGPT-550C-Launcher-win-x64.zip'
          Compress-Archive -Path (Join-Path $publishChatGpt '*') -DestinationPath $chatGptZip -CompressionLevel Optimal

          $publishCodex = Join-Path $PWD 'publish-codex'
          dotnet publish src/Codex550COverlay/Codex550COverlay.csproj -c Release -r win-x64 --self-contained true -p:LauncherEdition=Codex -o $publishCodex
          if ($LASTEXITCODE -ne 0) { throw 'Codex edition publish failed.' }
          Copy-Item packaging/codex/* $publishCodex/ -Force
          $codexZip = Join-Path $PWD 'Codex-550C-Launcher-win-x64.zip'
          Compress-Archive -Path (Join-Path $publishCodex '*') -DestinationPath $codexZip -CompressionLevel Optimal

          $hashLines = @(
            "$((Get-FileHash $chatGptZip -Algorithm SHA256).Hash.ToLowerInvariant())  $(Split-Path $chatGptZip -Leaf)"
            "$((Get-FileHash $codexZip -Algorithm SHA256).Hash.ToLowerInvariant())  $(Split-Path $codexZip -Leaf)"
          )
          $hashLines | Set-Content (Join-Path $PWD 'SHA256SUMS.txt') -Encoding ascii

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME 'ChatGPT-550C-Launcher-win-x64.zip' 'Codex-550C-Launcher-win-x64.zip' 'SHA256SUMS.txt' --title "ChatGPT / Codex 550C 开场动画 $env:GITHUB_REF_NAME" --generate-notes
